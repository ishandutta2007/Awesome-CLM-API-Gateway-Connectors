<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
    .flow-path { stroke-dasharray: 12, 12; animation: flowLine 15s linear infinite; }
    .float-1 { animation: floatCard1 5s ease-in-out infinite; }
    .float-2 { animation: floatCard2 6s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="120" r="180" fill="url(#accentCyan)" filter="url(#softGlow)" />
  <circle class="orb-2" cx="980" cy="280" r="220" fill="url(#accentPurple)" filter="url(#softGlow)" />

  <!-- Animated Data Flow Lines (Background Decorative) -->
  <g opacity="0.35">
    <path class="flow-path" d="M -50,90 Q 300,160 600,80 T 1250,110" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-path" d="M -50,330 Q 350,220 700,340 T 1250,290" fill="none" stroke="#c084fc" stroke-width="2" style="animation-direction: reverse;" />
  </g>

  <!-- Side Floating Flow Elements (Behind Text) -->
  <g class="float-1" opacity="0.6">
    <rect x="70" y="270" width="170" height="54" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="95" cy="297" r="10" fill="#38bdf8" />
    <text x="115" y="302" fill="#e2e8f0" font-size="13" font-family="sans-serif" font-weight="600">CLM Repository</text>
  </g>

  <g class="float-2" opacity="0.6">
    <rect x="960" y="80" width="170" height="54" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="985" cy="107" r="10" fill="#818cf8" />
    <text x="1005" y="112" fill="#e2e8f0" font-size="13" font-family="sans-serif" font-weight="600">Enterprise iPaaS</text>
  </g>

  <!-- Foreground Title Card / Badges -->
  <g transform="translate(600, 105)" text-anchor="middle">
    <!-- Category Pill -->
    <rect x="-140" y="-35" width="280" height="34" rx="17" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#glow)" />
    <text x="0" y="-13" fill="#a5b4fc" font-size="13" font-family="sans-serif" font-weight="700" letter-spacing="2">ENTERPRISE INTEGRATION ECOSYSTEM</text>

    <!-- Main Title (Strictly Foreground, Crisp) -->
    <text class="title-text" x="0" y="65" font-size="44" fill="url(#primaryGrad)" filter="url(#glow)" letter-spacing="-0.5">
      CLM API GATEWAY &amp; CONNECTORS
    </text>

    <!-- Subtitle -->
    <text class="sub-text" x="0" y="115" font-size="19" fill="#e2e8f0" font-weight="500" letter-spacing="0.3">
      Curated List of SaaS Platforms &amp; Open-Source Orchestration Gateways
    </text>

    <!-- Secondary Tagline / SEO Highlights -->
    <text class="sub-text" x="0" y="150" font-size="14" fill="#94a3b8" font-weight="400">
      Contract Lifecycle Integration • API Orchestration • Enterprise iPaaS • Workflow Automation
    </text>
  </g>

  <!-- Interactive Feature Badges in Footer of Banner -->
  <g transform="translate(600, 345)" text-anchor="middle">
    <!-- Pill 1 -->
    <g transform="translate(-240, 0)">
      <rect x="-80" y="-18" width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text y="4" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="600">⚡ 10+ Enterprise SaaS</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-18" width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text y="4" fill="#818cf8" font-size="12" font-family="sans-serif" font-weight="600">🌐 11+ Open-Source Gateways</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(240, 0)">
      <rect x="-80" y="-18" width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text y="4" fill="#c084fc" font-size="12" font-family="sans-serif" font-weight="600">📊 Pricing &amp; Scale Verified</text>
    </g>
  </g>
</svg>
